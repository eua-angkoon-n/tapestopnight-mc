# Phase 1-4: the Game Server, Postgres, the socket proxy and the Status Poller.
# The web app and the bot arrive in later phases so that a failure stays
# attributable to one thing.
#
# The Host already runs the `family-ledger` compose project. This project is
# namespaced away from it: distinct name, network, container and volume.
name: tapestopnight-mc

services:
  mc:
    # java8, not latest. Forge 14.23.5 / MC 1.12.2 requires Java 8 (ADR-0005);
    # the image ships Temurin 1.8.0_312.
    image: itzg/minecraft-server:java8
    container_name: tapestopnight-mc
    restart: unless-stopped
    stdin_open: true
    tty: true

    ports:
      # 25565 only. RCON on 25575 is reachable from inside this network and is
      # NEVER published to the Host — see the design notes.
      - "25565:25565"

    volumes:
      # The pack materialised by deploy/fetch-modpack.sh from the pinned
      # SHA256. Forge installs itself in here on first boot.
      - /srv/mc/pack:/data

    environment:
      EULA: "TRUE"
      TYPE: FORGE
      VERSION: "1.12.2"
      FORGE_VERSION: "14.23.5.2860"
      TZ: Asia/Bangkok

      # ── ADR-0002 / ADR-0005 ───────────────────────────────────────
      # MANDATORY. Without this the image regenerates server.properties from
      # env vars on every start and erases the file rendered from Postgres.
      # No server.properties-shaped env var may be added to this service.
      SKIP_SERVER_PROPERTIES: "true"

      # ── ADR-0012 ──────────────────────────────────────────────────
      # 8G is deliberate and near this Host's limit. USE_AIKAR_FLAGS is the
      # mitigation, not a nice-to-have: verified against the image, MEMORY
      # under 12g selects Aikar's standard branch, which sets
      # InitiatingHeapOccupancyPercent=15 (starts concurrent marking early so
      # G1 reclaims incrementally instead of falling back to a single-threaded
      # full GC — Java 8 has no parallel full GC, that arrived in JDK 10) and
      # -XX:+AlwaysPreTouch (keeps the whole heap resident so it is never the
      # thing that swaps). Do not remove either.
      # 8G was tried first and measured 9.04 GiB RSS with zero players — 90.4%
      # of mem_limit, leaving ~500 MB for metaspace and G1 structures to grow
      # into once players connect. 7G measures ~8.0-8.5 GiB and restores real
      # headroom. See the "Revised after measurement" note in ADR-0012.
      MEMORY: "7G"
      USE_AIKAR_FLAGS: "true"

      # Measure the pauses instead of arguing about them (ADR-0012).
      # PrintGCApplicationStoppedTime is the number that matters: total time
      # the world was frozen, which is what a player actually experiences.
      # NOTE: /data/logs must EXIST before the JVM starts. Java 8 opens the GC
      # log at startup and, if the directory is missing, prints
      #   "Cannot open file /data/logs/gc.log due to No such file or directory"
      # and carries on with no GC logging at all. The pack ships no logs/
      # directory and log4j creates it ~55s into boot, which is far too late.
      # deploy/prepare-host.sh creates it up front.
      JVM_OPTS: >-
        -Xloggc:/data/logs/gc.log
        -XX:+PrintGCDetails
        -XX:+PrintGCDateStamps
        -XX:+PrintGCApplicationStoppedTime
        -XX:+UseGCLogFileRotation
        -XX:NumberOfGCLogFiles=5
        -XX:GCLogFileSize=10M

      # ── RCON ──────────────────────────────────────────────────────
      # Used by the image for graceful shutdown, and later by the bot and the
      # Apply action. enable-rcon and rcon.password live in server.properties
      # because SKIP_SERVER_PROPERTIES means the image will not write them.
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be set in deploy/.env}

      # Give players warning before a graceful stop rather than dropping them.
      STOP_SERVER_ANNOUNCE_DELAY: "20"

    # ── ADR-0005: no healthcheck ────────────────────────────────────
    # The image ships one by default (mc-health, 30s interval, 120s start
    # period, 2 retries). It must be off: max-tick-time=-1 is mandatory for
    # this pack because OTG structure generation legitimately blocks the main
    # thread for minutes, and first boot exceeds the start period outright. A
    # healthcheck here reports a healthy server as failed.
    healthcheck:
      disable: true

    # A large OTG world takes minutes to save. Cutting the save short is how
    # world corruption happens.
    stop_grace_period: 10m

    # ── ADR-0010 / ADR-0012 ─────────────────────────────────────────
    # mem_limit sits above expected RSS (~9.4-9.9 GB) so the cgroup bounds the
    # JVM without strangling it. oom_score_adj biases the kernel's OOM killer
    # away from this container: by default it targets the largest consumer,
    # which is exactly this process, and would drop every connected player.
    mem_limit: 10g
    oom_score_adj: -500

    networks:
      - mc

  # ── Phase 3: the Desired Config store (ADR-0002) ──────────────────
  db:
    # 16-alpine matches the PostgreSQL 16.15 the family-ledger project already
    # runs on this Host. Same major version means one mental model for
    # backups and upgrades instead of two.
    image: postgres:16-alpine
    container_name: tapestopnight-db
    restart: unless-stopped

    # NOT port-published. Nothing outside this network needs to reach it, and
    # the ledger project sets the same precedent. Reached as host `db`.
    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in deploy/.env}
      TZ: Asia/Bangkok

    # ADR-0012 budgets ~300 MB for this. The workload is a few dozen config
    # rows and one status row polled every 15s, so the 128 MB default-ish
    # shared_buffers is already generous; the point is to stop Postgres
    # sizing itself against 12 GB of Host RAM it must not take.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    mem_limit: 384m

    volumes:
      - db-data:/var/lib/postgresql/data

    # Unlike the Game Server, a healthcheck here is correct: Postgres has no
    # equivalent of OTG's legitimate multi-minute stalls.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - mc

  # ── Phase 4: scoped Docker access (ADR-0005) ──────────────────────
  socket-proxy:
    # The control plane must be able to start and stop the Game Server, but
    # mounting /var/run/docker.sock into it would be equivalent to root on a
    # Host that also runs the ledger system. This proxy sits in between.
    #
    # HONEST LIMITATION: ADR-0005 specified scoping to
    #   POST /containers/{mc}/{start,stop,restart}
    # This proxy filters by API *section*, not by endpoint or container name, so
    # CONTAINERS=1 plus POST=1 is the tightest it can express — which also
    # permits creating and deleting containers. That is far narrower than the
    # raw socket but broader than the ADR claimed. Recorded rather than glossed
    # over; tightening it further needs a purpose-built shim.
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: tapestopnight-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
      # Everything else stays off. Listed explicitly so a future reader can see
      # these were considered rather than left to defaults.
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
      PLUGINS: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
    volumes:
      # Read-only: the proxy needs to talk to the daemon, not to be able to
      # replace the socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    networks:
      - mc

  # ── Phase 4: the Status Poller ────────────────────────────────────
  poller:
    # The ONLY thing that probes the Game Server. Everything else reads the
    # cache row it writes, so the Game Server sees constant probe load no
    # matter how many people are looking at the site.
    image: ${POLLER_IMAGE:-ghcr.io/eua-angkoon-n/mc-poller:latest}
    container_name: tapestopnight-poller
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/.env}
      MC_SLP_HOST: mc
      MC_SLP_PORT: "25565"
      DOCKER_PROXY_URL: http://socket-proxy:2375
      MC_CONTAINER_NAME: tapestopnight-mc
      POLL_INTERVAL_MS: "15000"
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    mem_limit: 128m
    networks:
      - mc

networks:
  mc:
    name: tapestopnight-mc

volumes:
  db-data:
    name: tapestopnight-db-data
