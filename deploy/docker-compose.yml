# Phase 1-5: the Game Server, Postgres, the socket proxy, the Status Poller and
# the web app. The Discord bot arrives in Phase 6.
#
# The Host already runs the `family-ledger` compose project. This project is
# namespaced away from it: distinct name, network, container and volume.
name: tapestopnight-mc

services:
  mc:
    # java17, not java8. Homestead's own variables.txt says
    # RECOMMENDED_JAVA_VERSION=17, and that is the number that wins here.
    # 21 almost certainly works and was the first choice; "almost certainly" is
    # how a 307-mod pack produces a mixin crash that names a mod rather than
    # the JRE, and nobody debugging at 23:00 starts by suspecting the JDK.
    # → ADR-0005, ADR-0018
    image: itzg/minecraft-server:java17
    container_name: tapestopnight-mc
    restart: unless-stopped
    stdin_open: true
    tty: true

    ports:
      # RCON on 25575 is reachable from inside this network and is NEVER
      # published to the Host — see the design notes.
      - "25565:25565"

      # ── ADR-0017: Simple Voice Chat ─────────────────────────────
      # UDP, and a DIFFERENT port from the game on purpose: the mod's own
      # config warns that sharing 25565 collides with the server query and
      # "may crash the server". The /udp suffix is not optional — without it
      # Docker publishes TCP, the mod binds UDP, and voice fails with the port
      # looking open to every tool that checks it.
      #
      # Also needs `ufw allow 24454/udp` on the Host; the compose publish and
      # the firewall are two separate doors and both have to be open.
      - "24454:24454/udp"

    volumes:
      # The pack materialised by deploy/fetch-modpack.sh from the pinned
      # SHA256. The Fabric server launcher installs itself in here on first
      # boot, the same way the Forge installer used to.
      - /srv/mc/pack:/data

    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.20.1"
      # Matches LOADER_VERSION in modpack.lock, which came from the pack's own
      # variables.txt (MODLOADER_VERSION=0.18.4). Left unset, the image installs
      # the newest loader — which usually works, and "usually" is how a box
      # stops being reproducible. Required rather than defaulted, so the two
      # cannot drift apart silently.
      FABRIC_LOADER_VERSION: ${FABRIC_LOADER_VERSION:?set FABRIC_LOADER_VERSION in deploy/.env to match LOADER_VERSION in modpack.lock (0.18.4)}
      TZ: Asia/Bangkok

      # ── ADR-0002 / ADR-0005 ───────────────────────────────────────
      # MANDATORY. Without this the image regenerates server.properties from
      # env vars on every start and erases the file rendered from Postgres.
      # No server.properties-shaped env var may be added to this service.
      SKIP_SERVER_PROPERTIES: "true"

      # ── heap ──────────────────────────────────────────────────────
      # 8G, chosen by the operator, and NOT YET MEASURED on this pack.
      #
      # ADR-0012 settled on 7G, and it settled it by measuring Forge 1.12.2 on
      # Java 8 — a runtime this service no longer uses. Java 17's G1 has a
      # parallel full GC (JDK 10), and Fabric with Lithium and C2ME holds far
      # less per chunk than Forge did, so the old figure is a poor predictor in
      # both directions and neither 7G nor 8G can be justified from it.
      #
      # Homestead's own docs ask for 8-12 GB. This Host has 12 GB in total and
      # shares it, so 8G is the top of what is available rather than a
      # comfortable middle. Measure RSS once it is up and idle; above ~9.6 GiB
      # (96% of mem_limit) drop back to 7G rather than waiting for the OOM
      # killer to pick the JVM with players connected.
      #
      # USE_AIKAR_FLAGS stays on and is still the mitigation, not decoration:
      # under 12g it selects Aikar's standard branch, which sets
      # InitiatingHeapOccupancyPercent=15 (concurrent marking starts early, so
      # G1 reclaims incrementally instead of falling back to a full GC) and
      # -XX:+AlwaysPreTouch (the heap stays resident, so it is never the thing
      # that swaps). Do not remove either.
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"

      # Measure the pauses instead of arguing about them.
      #
      # This is the unified-logging (-Xlog) spelling of what used to be here.
      # The old flags were not merely deprecated on Java 17: -Xloggc,
      # -XX:+PrintGCDetails, -XX:+UseGCLogFileRotation, -XX:NumberOfGCLogFiles
      # and -XX:GCLogFileSize were REMOVED in JDK 16, and a JVM started with
      # them refuses to boot rather than warning. Carrying the Dregora block
      # forward would have produced a container that exits immediately on an
      # "Unrecognized VM option" line, with no Minecraft output at all to say
      # why.
      #
      # `safepoint` replaces PrintGCApplicationStoppedTime, and it is the
      # number that matters: total time the world was frozen, which is what a
      # player actually experiences.
      #
      # NOTE: /data/logs must EXIST before the JVM starts. The JVM opens the
      # log at startup and, if the directory is missing, carries on with no GC
      # logging at all. The pack ships no logs/ directory and log4j creates it
      # well into boot, far too late. deploy/prepare-host.sh creates it up
      # front — still required, for the same reason as before.
      JVM_OPTS: >-
        -Xlog:gc*,safepoint:file=/data/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10M

      # ── RCON ──────────────────────────────────────────────────────
      # Used by the image for graceful shutdown, and later by the bot and the
      # Apply action. enable-rcon and rcon.password live in server.properties
      # because SKIP_SERVER_PROPERTIES means the image will not write them.
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be set in deploy/.env}

      # Give players warning before a graceful stop rather than dropping them.
      STOP_SERVER_ANNOUNCE_DELAY: "20"

    # ── ADR-0005: no healthcheck ────────────────────────────────────
    # The image ships one by default (mc-health, 30s interval, 120s start
    # period, 2 retries). It stays off.
    #
    # The original reason was OpenTerrainGenerator, which Homestead does not
    # have — but the conclusion outlives the reason. First boot of a 374-mod
    # pack exceeds the 120s start period outright, and Homestead builds terrain
    # through Tectonic and TerraBlender, which still stalls long enough to fail
    # a 30s probe under load. What a healthcheck buys is an automatic restart;
    # what it costs is that restart arriving mid chunk-write. That trade was
    # bad on Dregora and it is bad here.
    healthcheck:
      disable: true

    # A large world takes minutes to save. Cutting the save short is how
    # region files corrupt.
    stop_grace_period: 10m

    # ── ADR-0010 ────────────────────────────────────────────────────
    # mem_limit bounds the JVM without strangling it, and is deliberately NOT
    # raised alongside MEMORY: leaving it at 10g is what makes the 8G decision
    # measurable. An 8G heap needing more than 10g of RSS is one this Host
    # cannot afford, and the cgroup is where that shows up as a number instead
    # of as the whole box quietly swapping.
    #
    # oom_score_adj biases the kernel's OOM killer away from this container:
    # by default it targets the largest consumer, which is exactly this
    # process, and would drop every connected player.
    mem_limit: 10g
    oom_score_adj: -500

    networks:
      - mc

  # ── Phase 3: the Desired Config store (ADR-0002) ──────────────────
  db:
    # 16-alpine matches the PostgreSQL 16.15 the family-ledger project already
    # runs on this Host. Same major version means one mental model for
    # backups and upgrades instead of two.
    image: postgres:16-alpine
    container_name: tapestopnight-db
    restart: unless-stopped

    # NOT port-published. Nothing outside this network needs to reach it, and
    # the ledger project sets the same precedent. Reached as host `db`.
    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in deploy/.env}
      TZ: Asia/Bangkok

    # ADR-0012 budgets ~300 MB for this. The workload is a few dozen config
    # rows and one status row polled every 15s, so the 128 MB default-ish
    # shared_buffers is already generous; the point is to stop Postgres
    # sizing itself against 12 GB of Host RAM it must not take.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    mem_limit: 384m

    volumes:
      - db-data:/var/lib/postgresql/data

    # Unlike the Game Server, a healthcheck here is correct: Postgres has no
    # equivalent of OTG's legitimate multi-minute stalls.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - mc

  # ── Phase 4: scoped Docker access (ADR-0005) ──────────────────────
  socket-proxy:
    # The control plane must be able to start and stop the Game Server, but
    # mounting /var/run/docker.sock into it would be equivalent to root on a
    # Host that also runs the ledger system. This proxy sits in between.
    #
    # HONEST LIMITATION: ADR-0005 specified scoping to
    #   POST /containers/{mc}/{start,stop,restart}
    # This proxy filters by API *section*, not by endpoint or container name, so
    # CONTAINERS=1 plus POST=1 is the tightest it can express — which also
    # permits creating and deleting containers. That is far narrower than the
    # raw socket but broader than the ADR claimed. Recorded rather than glossed
    # over; tightening it further needs a purpose-built shim.
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: tapestopnight-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
      # Everything else stays off. Listed explicitly so a future reader can see
      # these were considered rather than left to defaults.
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      INFO: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      SYSTEM: "0"
      PLUGINS: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
    volumes:
      # Read-only: the proxy needs to talk to the daemon, not to be able to
      # replace the socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    networks:
      - mc

  # ── Phase 4: the Status Poller ────────────────────────────────────
  poller:
    # The ONLY thing that probes the Game Server. Everything else reads the
    # cache row it writes, so the Game Server sees constant probe load no
    # matter how many people are looking at the site.
    image: ${POLLER_IMAGE:-ghcr.io/eua-angkoon-n/mc-poller:latest}
    container_name: tapestopnight-poller
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/.env}
      MC_SLP_HOST: mc
      MC_SLP_PORT: "25565"
      DOCKER_PROXY_URL: http://socket-proxy:2375
      MC_CONTAINER_NAME: tapestopnight-mc
      POLL_INTERVAL_MS: "15000"
      TZ: Asia/Bangkok
    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    mem_limit: 128m
    networks:
      - mc

  # ── Phase 5: public pages + admin config UI ───────────────────────
  web:
    image: ${WEB_IMAGE:-ghcr.io/eua-angkoon-n/mc-web:latest}
    container_name: tapestopnight-web
    restart: unless-stopped

    # Loopback only, reached through Caddy — the same shape family-ledger
    # already uses on this Host (127.0.0.1:3001).
    ports:
      - "127.0.0.1:3002:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/.env}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in deploy/.env}
      AUTH_URL: ${AUTH_URL:-https://tapestopnight.com}
      AUTH_TRUST_HOST: "true"

      # ADR-0004: one role governs both the web UI and the bot.
      #
      # Deliberately NOT required. The public info pages (requirement 2.3) need
      # no Discord at all, so the site can serve them before these exist. With
      # them unset the authorisation check fails closed — every visitor is a
      # non-admin and /config answers 403 — which is the safe direction to
      # degrade in. Set them to enable admin login.
      AUTH_DISCORD_ID: ${DISCORD_CLIENT_ID:-}
      AUTH_DISCORD_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ADMIN_ROLE_ID: ${DISCORD_ADMIN_ROLE_ID:-}

      DOCKER_PROXY_URL: http://socket-proxy:2375
      MC_CONTAINER_NAME: tapestopnight-mc
      PACK_DIR: /pack

      # Needed by Apply, not by anything the web app does on its own.
      #
      # rcon.password is NOT a config_key row: locked keys are displayed with
      # their values on /config (ADR-0003), so storing it would print the
      # password to every admin. The renderer injects it from here instead
      # (SECRET_KEYS), which means the web container needs it even though it
      # never opens an RCON connection.
      #
      # Its absence is why Apply refused from the web UI while the bot's
      # /config apply worked: only the bot had it.
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be set in deploy/.env}
      TZ: Asia/Bangkok

    volumes:
      # ⚠ KNOWN PRIVILEGE, recorded rather than glossed over.
      #
      # Apply (ADR-0002) renders server.properties and must write it where the
      # Game Server reads it, and an atomic write needs rename(), which needs
      # the containing directory. So the pack directory is mounted read-write,
      # which also means this container could write into mods/ — i.e. an
      # admin-level web compromise could reach code execution inside the JVM.
      #
      # Weighed against: an admin can already change config and restart the
      # server, so this widens an existing capability rather than creating a
      # new class of one. Narrowing it properly needs a small purpose-built
      # writer sidecar that accepts only a rendered properties file — the same
      # shape as the socket-proxy gap noted above, and the same answer.
      - /srv/mc/pack:/pack

      # Site media — the hero video, its poster, the about image.
      #
      # Mounted rather than baked in, for ADR-0009's reason: git cannot
      # delta-compress a video, so every re-encode would add its full size to
      # the history permanently, and every image pull would carry it. The
      # standalone build serves apps/web/public from disk at runtime, so a
      # bind mount lands exactly where Next looks. Read-only: the web app has
      # no business writing here.
      - /srv/mc/media:/app/apps/web/public/media:ro

    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started

    mem_limit: 384m
    networks:
      - mc

  # ── Phase 6: the Discord bot ──────────────────────────────────────
  bot:
    image: ${BOT_IMAGE:-ghcr.io/eua-angkoon-n/mc-bot:latest}
    container_name: tapestopnight-bot
    restart: unless-stopped

    # No published ports. The bot dials OUT to Discord's gateway; nothing on
    # the internet ever needs to reach it.

    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/.env}

      # ⚠ ADR-0008. This token is DISCO NIGHT's. Discord permits exactly one
      # gateway session per token, so DISCO NIGHT must be STOPPED before this
      # container starts — two processes on one token knock each other offline
      # in a loop, and because the web app's admin check reads guild roles
      # through this same application, an unstable gateway breaks web login
      # too. Rotate the token after cutover.
      #
      # `:-` rather than `:?` on purpose, and it is not laxity. A required-
      # variable failure aborts the WHOLE `docker compose` invocation, not just
      # this service — so an unset bot token would also block
      # `docker compose up -d web`, taking the website down to protect a
      # service that is not running yet. The bot validates all four itself at
      # boot and exits naming the missing one, which is a better message than
      # compose's and costs the rest of the stack nothing.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # ADR-0004 makes this role the authority for both surfaces. Without it
      # every admin command would fall through to the break-glass table, so the
      # bot treats it as required and refuses to start.
      DISCORD_ADMIN_ROLE_ID: ${DISCORD_ADMIN_ROLE_ID:-}

      # /players list is the one command that reaches the Game Server, over
      # RCON, because Server List Ping returns only a shuffled sample of names.
      RCON_HOST: mc
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD must be set in deploy/.env}

      DOCKER_PROXY_URL: http://socket-proxy:2375
      MC_CONTAINER_NAME: tapestopnight-mc
      MC_SLP_HOST: mc
      MC_SLP_PORT: "25565"

      PACK_DIR: /pack
      PUBLIC_BASE_URL: ${AUTH_URL:-https://tapestopnight.com}
      RESTART_COUNTDOWN_SECONDS: "30"
      TZ: Asia/Bangkok

      # ── The Chat Bridge ───────────────────────────────────────────
      # Both paths are inside the pack mount below, so the bridge adds no
      # access this container did not already have. The world directory is
      # Homestead and not `world` because that is what level-name says.
      #
      # Reading the log FILE rather than `docker logs` is deliberate: the
      # container's stdout carries ANSI escapes from the pack's own colouring
      # (measured: `> [K[10:13:35] ...`), and the file on disk is clean.
      MC_LOG_PATH: /pack/logs/latest.log
      MC_WORLD_DIR: /pack/Homestead
      BRIDGE_POLL_MS: "2000"
      # Each scan asks the Game Server to flush the world first, because Better
      # Questing writes progress on save rather than on completion. Slow on
      # purpose — this is not a hot path and the flush is not free.
      MILESTONE_SCAN_MS: "60000"

    volumes:
      # ⚠ The same known privilege the web container carries, for the same
      # reason: /config apply renders server.properties and server-icon.png
      # where the Game Server reads them, and an atomic write needs rename(),
      # which needs the containing directory. Read-write therefore also means
      # this container could write into mods/. Weighed against the fact that
      # an admin can already change config and restart the server, this widens
      # an existing capability rather than creating a new class of one.
      - /srv/mc/pack:/pack

    depends_on:
      db:
        condition: service_healthy
      socket-proxy:
        condition: service_started

    # Node plus discord.js, holding one websocket. Measured against the
    # poller's 128m, which does less; 192m leaves room for an icon attachment
    # without inviting the OOM killer near a 7 GB JVM (ADR-0012).
    mem_limit: 192m
    networks:
      - mc

networks:
  mc:
    name: tapestopnight-mc

volumes:
  db-data:
    name: tapestopnight-db-data
