# Modpack pin (ADR-0009).
#
# The payload is NOT in git: git cannot delta-compress jars, and Prominence II
# ships 373 of them, 800 MB between them. The zip lives in off-box storage; this file is how we
# prove the bytes are the right ones.
#
# Mod version drift is the most common cause of "my client can't join".
# fetch-modpack.sh MUST verify SHA256 before unpacking.

MODPACK_NAME="Prominence II: Hasturian Era"
MODPACK_VERSION="4.1.9"
# Stored under a shorter, lower-case name. Upstream calls it
# "Prominence_II_Hasturian_Era_4.1.9_server_pack.zip"; fetch-modpack.sh
# downloads from MODPACK_URL and writes it HERE.
MODPACK_FILE="prominence-ii-hasturian-era-4.1.9-server.zip"
MODPACK_SIZE_BYTES=1133643907
MODPACK_SHA256="0225d5b5e3cb119ae1d543527d38cbbd8a7d18507469b25ac85feb4c9af160bc"

# Where fetch-modpack.sh downloads from.
#
# The server pack is a CurseForge "Additional File" of the 4.1.9 release
# (file 9690745, beside main file 9690664; project 466901), and the CDN serves
# it to curl without an API key, as the last two packs' did. The SHA256 above
# is what makes trusting a CDN acceptable. Hashed on 2026-11-20 from a
# download of exactly this URL.
#
# This pack releases about weekly and has shipped a broken server pack twice
# (4.0.2, 4.0.4, both re-uploaded). The pin is what stops a re-upload under
# the same name from landing here unnoticed.
MODPACK_URL="https://mediafilez.forgecdn.net/files/9690/745/Prominence_II_Hasturian_Era_4.1.9_server_pack.zip"

# EMPTY on purpose: this archive puts mods/, config/, datapacks/ … at its
# root, with no wrapper directory (Homestead, also a ServerPackCreator pack,
# had one). Re-check on every upgrade with:
#   unzip -Z1 "$MODPACK_FILE" | head
MODPACK_ZIP_PREFIX=""

# Where players get the pack, and where they read about it. Seeded into
# server_info by db/seed/seed.ts so the website, the bot and this pin cannot
# disagree about which pack is running.
MODPACK_PAGE_URL="https://www.curseforge.com/minecraft/modpacks/prominence-2-hasturian-era"
MODPACK_WIKI_URL="https://servers.cinderstonestudios.com/create-server"

# Runtime the pack requires. Read out of the pack's own variables.txt, not
# guessed: MINECRAFT_VERSION=1.20.1, MODLOADER=Fabric, MODLOADER_VERSION=0.20.1,
# RECOMMENDED_JAVA_VERSION=17.
#
# From the Casket of Reveries pin only the loader changed: Forge became
# Fabric again, as it was for Homestead. Minecraft and Java did not move.
MINECRAFT_VERSION="1.20.1"
LOADER_NAME="Fabric"
LOADER_VERSION="0.20.1"
JAVA_MAJOR=17

# Paths deleted after unpacking (ADR-0009).
#
# Only the pack's own launcher, which is a foot-gun under itzg rather than
# client payload: start.sh downloads the ServerStarterJar and installs a
# SECOND server into the same directory. Anybody who runs it while debugging
# gets a second Minecraft that fights the first over the world. variables.txt
# is that launcher's settings file (JAVA_ARGS="-Xmx8G -Xms8G"); itzg ignores
# it, and leaving it would suggest it is where the heap is set. It is not: see
# MEMORY in docker-compose.yml.
#
# No mods are deleted. Fabric skips a mod that declares
# `"environment": "client"` on a dedicated server; of this archive's 373 jars
# three declare that and 370 declare `*` — the pack's author already removed
# the client-side set (the client pack has about 200 more).
CLIENT_ONLY_PATHS=(
  "start.sh"
  "start.bat"
  "start.ps1"
  "install_java.sh"
  "install_java.ps1"
  "variables.txt"
)
