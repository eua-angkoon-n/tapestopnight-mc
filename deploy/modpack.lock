# Modpack pin (ADR-0009).
#
# The payload is NOT in git: mods/ alone is 565 MB across 206 jars, and git
# cannot delta-compress jars. The zip lives in off-box storage; this file is
# how we prove the bytes are the right ones.
#
# Mod version drift is the most common cause of "my client can't join".
# fetch-modpack.sh MUST verify SHA256 before unpacking.

MODPACK_NAME="RLCraft Dregora"
MODPACK_VERSION="v1.1.2b"
MODPACK_FILE="RLCraft Dregora v1.1.2b - server pack.zip"
MODPACK_SIZE_BYTES=676115507
MODPACK_SHA256="548a32645f6bf104f4f2eeea3409ba3baf162dd428f113647f16990ec270ac5a"

# Where fetch-modpack.sh downloads from.
#
# DELIBERATELY EMPTY — decided 2026-09-09. The zip is kept on the Host at
# /srv/mc/dist/ and on the maintainer's own machine, and that is judged
# enough for a two-person game server. fetch-modpack.sh already handles this
# correctly: it uses a local archive when one is present, and dies with a
# clear message rather than pretending, when one is not.
#
# The cost, stated so nobody is surprised by it: a clean-box rebuild needs
# someone to bring the zip along. The SHA256 below still does its real job —
# proving the bytes are the right ones — but it cannot fetch them. If the
# Host is ever lost with no local copy to hand, this exact build is gone and
# the pack would have to be re-downloaded from CurseForge and re-pinned.
MODPACK_URL=""

# Runtime the pack requires (see docs/adr and the pack's SERVER README OR DIE.txt)
MINECRAFT_VERSION="1.12.2"
FORGE_VERSION="14.23.5.2860"
JAVA_MAJOR=8

# Client-only paths shipped in the "server pack" that the Game Server never
# reads. fetch-modpack.sh deletes these after unpacking (ADR-0009).
# Verified by inspecting the archive. structures/ is deliberately absent from
# this list: its .rcst/.rcig/.rcgp/.rcbm files are Recurrent Complex worldgen
# definitions and ARE server-side.
CLIENT_ONLY_PATHS=(
  "resources"        # 135.8 MB - menu animation frames, dsurround sounds, GUI art
  "resourcepacks"    #  16.9 MB
  "shaderpacks"      #   3.7 MB
  "fancymenu_data"   #   1.7 MB - FancyMenu is a client main-menu mod
  "options.txt"
  "optionsof.txt"
  "optionsshaders.txt"
)
