# Mods added to the pack AFTER unpacking the pinned zip — ADR-0017.
#
# Until this file existed, the Game Server's mods/ directory was exactly what
# came out of the verified archive. It is now "the archive, plus these". That
# is a real change to what `modpack.lock` alone can promise, which is why it
# is a separate file with the same discipline rather than a line in a script:
# a URL and a SHA256, verified before anything is written.
#
# Why not just put the jar in the zip: the zip is UPSTREAM's. Rebuilding it to
# add one mod would fork the pack onto a hash nobody else can verify, and
# every future pack update would have to be re-forked the same way.
#
# ⚠ Every entry here must be re-checked against MINECRAFT_VERSION and
# LOADER_VERSION in modpack.lock on any pack upgrade. fetch-modpack.sh unpacks
# with `unzip -o` and does NOT clear mods/, so these jars SURVIVE a pack
# upgrade — including one to a Minecraft version they do not support, where a
# stale jar stops the server booting at all.

# ── Empty, as of the move to Homestead ───────────────────────────────
#
# The only entry this file ever had was Simple Voice Chat, added on top of
# Dregora because Dregora did not ship it. Homestead does: it is one of the
# pack's 374 mods, so pinning a second copy here would put two voicechat jars
# in mods/ and Fabric refuses to start on a duplicate mod id.
#
# The mechanism stays. It is not dead code — it is the thing that makes
# "which mods are on this server" answerable, and an empty list is a truthful
# answer rather than an absent one. fetch-extra-mods.sh --check passes
# trivially against it.
#
# Note what does NOT go away with the jar: overlay/config/voicechat/ still
# carries our two settings (voice_host, force_voice_chat), the compose file
# still publishes 24454/udp, and ufw still allows it. Voice chat is still
# configured here; it is only no longer *installed* from here.
EXTRA_MODS=(
)
