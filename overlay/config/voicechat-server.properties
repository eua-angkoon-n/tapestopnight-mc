# Simple Voice Chat, server side — ADR-0017.
#
# Only the two keys that MUST be right are set here. The mod writes the full
# key set with its own defaults on first boot; anything not named below is
# deliberately left to it, because a value identical to the default is not a
# decision, it is a thing to keep in sync for no reason.
#
# After the first boot, copy the file the mod actually rendered back over this
# one — it will contain these two keys plus its own config_version header, and
# an overlay that does not match disk reports as drift forever.

# UDP, and NOT the Minecraft port. The mod's own config text warns that sharing
# 25565 collides with the server query and "may crash the server".
# Must also be published by docker compose and opened in ufw.
port=24454

# ── The one that fails silently if it is wrong ───────────────────────────────
#
# ADR-0001: players type `tapestopnight.com`, which is Cloudflare-PROXIED. Only
# the SRV target `mc.tapestopnight.com` is DNS-only and reaches this Host
# directly. Cloudflare does not carry Minecraft's UDP, so if the client works
# out its voice destination from the name that was typed rather than from the
# socket it ended up on, every voice packet is sent into Cloudflare and dropped
# — with no error in the server log, the client log, or anywhere else.
#
# Naming the host explicitly costs one line and removes the whole question.
voice_host=mc.tapestopnight.com:24454
